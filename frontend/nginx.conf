# Bach to Basics: nginx config for the static frontend container.
#
# Serves the built React app and proxies /api/* to the backend service.
# Backend hostname "backend" is resolved via Docker Compose's network.

server {
    listen 80;
    server_name _;
    root   /usr/share/nginx/html;
    index  index.html;

    # ── Security headers ────────────────────────────────────────────────────
    # These are set here (server block) so they apply to all responses that
    # don't have their own add_header directives.
    # NOTE: nginx does NOT inherit server-level add_header into location blocks
    # that define their own add_header (e.g. /assets/).  Those blocks repeat
    # the security headers explicitly to avoid the inheritance pitfall.
    # /api/ is intentionally excluded - the FastAPI backend sets its own.
    add_header X-Frame-Options        "DENY"                                          always;
    add_header X-Content-Type-Options "nosniff"                                       always;
    add_header Referrer-Policy        "no-referrer"                                   always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()"      always;

    # SPA fallback: any route that isn't a real file goes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Revalidate the page on every refresh. sw.js only retires older installs.
    location = /index.html {
        expires epoch;
    }
    location = /sw.js {
        expires epoch;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        expires epoch;
        return 410;
    }
    location = /registerSW.js {
        expires epoch;
        default_type application/javascript;
        return 200 "/* PWA disabled */";
    }

    # alphaTab 的 worker 是 .mjs，nginx 默认 mime.types 里没有这个扩展名，
    # 不加这段浏览器会以 MIME 类型不对为由拒绝加载 module worker。
    location ~ ^/assets/.*\.mjs$ {
        types { }
        default_type application/javascript;
    }

    # API proxy, strips the /api prefix on the way through
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Sample / soundfont uploads can be large
        client_max_body_size 60M;
        # OMR + transcription can take a while
        proxy_read_timeout   300s;
    }

    # Cache static assets aggressively (Vite hashes filenames).
    # Repeats security headers because this block defines its own add_header
    # (nginx would otherwise drop the server-level ones here).
    location /assets/ {
        expires 1y;
        add_header Cache-Control         "public, immutable"                          always;
        add_header X-Frame-Options        "DENY"                                      always;
        add_header X-Content-Type-Options "nosniff"                                   always;
        add_header Referrer-Policy        "no-referrer"                               always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()"  always;
    }
}
